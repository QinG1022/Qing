<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智能文档处理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- 引入Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="material-icons">description</span>
                <h1>智能文档系统</h1>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>
            <div id="loginTab" class="tab-content">
                <h2>用户登录</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <input type="text" id="loginUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" checked>
                            记住我
                        </label>
                    </div>
                    <button type="submit" class="btn primary-btn full-width">登录</button>
                </form>
            </div>
            <div id="registerTab" class="tab-content" style="display: none;">
                <h2>用户注册</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerUsername">用户名</label>
                        <input type="text" id="registerUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">邮箱</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">密码</label>
                        <input type="password" id="registerPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认密码</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn primary-btn full-width">注册</button>
                </form>
            </div>
            <div class="login-footer">
                <a href="/" class="btn text-btn"><span class="material-icons">home</span>返回首页</a>
            </div>
        </div>
        <!-- 提示消息 -->
        <div id="toastContainer" class="toast-container"></div>
        <!-- 加载遮罩 -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loader"></div>
            <p id="loadingMessage">正在处理，请稍候...</p>
        </div>
    </div>
    
    <script src="/static/js/login.js"></script>
</body>
</html>
