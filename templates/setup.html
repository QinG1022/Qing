<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qing · 首次配置</title>
    <style>
        :root {
            --primary: #2196f3;
            --accent: #21bf73;
            --bg: #f5f7fa;
            --card: #fff;
            --text: #1f2a37;
            --muted: #667085;
            --border: #e4e8ee;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(900px 420px at 10% -10%, rgba(33,150,243,.14), transparent 60%),
                radial-gradient(700px 380px at 95% 105%, rgba(33,191,115,.14), transparent 60%),
                var(--bg);
            color: var(--text);
        }
        .card {
            width: 100%;
            max-width: 460px;
            padding: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 18px 40px rgba(16,24,40,.1);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .mark {
            width: 34px; height: 34px; border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; font-size: 18px;
        }
        h1 { font-size: 20px; margin: 0; }
        .sub { color: var(--muted); font-size: 13px; margin: 6px 0 22px; line-height: 1.6; }
        label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .field { margin-bottom: 14px; }
        input, select {
            width: 100%; padding: 10px 12px;
            border: 1px solid var(--border); border-radius: 8px;
            background: #f7f9fc; color: var(--text);
            font-size: 13.5px; font-family: inherit;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; }
        .hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        button {
            padding: 10px 16px; border-radius: 8px; font-size: 13.5px;
            font-family: inherit; font-weight: 500; cursor: pointer;
            border: 1px solid var(--border); background: #fff; color: var(--text);
        }
        button:hover { border-color: var(--primary); color: var(--primary); }
        button.primary {
            background: var(--primary); border-color: transparent; color: #fff;
            box-shadow: 0 6px 16px rgba(33,150,243,.3);
        }
        button.primary:hover { background: #0D47A1; color: #fff; }
        .status { margin-top: 14px; font-size: 12.5px; min-height: 18px; }
        .status.ok { color: #11af63; }
        .status.err { color: #e53935; }
        .status.busy { color: var(--muted); }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="mark">✦</div>
        <h1>首次配置</h1>
    </div>
    <p class="sub">
        填一次就能用。配置保存在本机的 <code>config.json</code>，不会上传到任何地方；<br>
        模型请求由本机服务端转发，浏览器不直接接触 API Key。
    </p>

    <div class="field">
        <label for="provider">服务商</label>
        <select id="provider">
            <option value="siliconflow">硅基流动 SiliconFlow</option>
            <option value="deepseek">DeepSeek 官方</option>
            <option value="custom">自定义（OpenAI 兼容）</option>
        </select>
    </div>

    <div class="field">
        <label for="base_url">接口地址 Base URL</label>
        <input id="base_url" placeholder="https://api.siliconflow.cn/v1">
        <div class="hint">需要兼容 OpenAI 的 /chat/completions 接口</div>
    </div>

    <div class="field">
        <label for="api_key">API Key</label>
        <input id="api_key" type="password" placeholder="sk-...">
        <div class="hint" id="keyState">仅保存在本机 config.json</div>
    </div>

    <div class="field">
        <label for="model">模型名称</label>
        <input id="model" placeholder="deepseek-ai/DeepSeek-R1-Distill-Qwen-7B">
    </div>

    <div class="actions">
        <button id="testBtn">测试连接</button>
        <button class="primary" id="saveBtn">保存并进入</button>
    </div>

    <div class="status" id="status"></div>
</div>

<script>
(function () {
    'use strict';

    var PRESETS = {
        siliconflow: ['https://api.siliconflow.cn/v1', 'deepseek-ai/DeepSeek-R1-Distill-Qwen-7B'],
        deepseek: ['https://api.deepseek.com/v1', 'deepseek-chat'],
        custom: ['', '']
    };

    var $ = function (id) { return document.getElementById(id); };

    function setStatus(text, cls) {
        var s = $('status');
        s.textContent = text || '';
        s.className = 'status' + (cls ? ' ' + cls : '');
    }

    function payload() {
        return {
            provider: $('provider').value,
            base_url: $('base_url').value.trim(),
            api_key: $('api_key').value.trim(),
            model: $('model').value.trim()
        };
    }

    $('provider').addEventListener('change', function () {
        var preset = PRESETS[this.value] || ['', ''];
        if (preset[0]) $('base_url').value = preset[0];
        if (preset[1]) $('model').value = preset[1];
    });

    $('testBtn').addEventListener('click', function () {
        var data = payload();
        if (!data.api_key) { setStatus('请先填写 API Key', 'err'); $('api_key').focus(); return; }
        setStatus('正在测试…', 'busy');
        fetch('/api/settings/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(function (r) { return r.json(); })
          .then(function (res) {
              setStatus(res.message || (res.success ? '连接成功' : '连接失败'), res.success ? 'ok' : 'err');
          })
          .catch(function (e) { setStatus('请求失败：' + e, 'err'); });
    });

    $('saveBtn').addEventListener('click', function () {
        var data = payload();
        if (!data.api_key) { setStatus('请先填写 API Key', 'err'); $('api_key').focus(); return; }
        setStatus('正在保存…', 'busy');
        fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(function (r) { return r.json(); })
          .then(function (res) {
              if (res.success) {
                  setStatus('已保存，正在进入…', 'ok');
                  setTimeout(function () { window.location.href = '/?skip_welcome=true'; }, 500);
              } else {
                  setStatus(res.message || '保存失败', 'err');
              }
          })
          .catch(function (e) { setStatus('请求失败：' + e, 'err'); });
    });

    // 已配置过就回填（Key 打码，留空表示不修改）
    fetch('/api/settings').then(function (r) { return r.json(); }).then(function (res) {
        if (!res || !res.settings) return;
        var s = res.settings;
        if (s.provider) $('provider').value = s.provider;
        if (s.base_url) $('base_url').value = s.base_url;
        if (s.model) $('model').value = s.model;
        if (s.api_key_set) {
            $('api_key').placeholder = s.api_key_masked + '（留空则不修改）';
            $('keyState').textContent = '已配置：' + s.api_key_masked + '，留空表示不修改';
        }
    }).catch(function () { /* 忽略 */ });
})();
</script>
</body>
</html>
