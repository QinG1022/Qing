<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档生成工具</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1><span class="material-icons"></span> 智能文档处理系统</h1>
            <div class="header-subtitle">高效处理文档，提取信息，生成报告</div>
        </header>

        <div class="main-content">
            <div class="tab-container">
                <button class="tab-button active" data-tab="tab1">
                    <span class="material-icons"></span> 文档生成与图片处理
                </button>
                <button class="tab-button" data-tab="tab2">
                    <span class="material-icons"></span> 提取PDF文本
                </button>
            </div>

            <div class="tab-pane active" id="tab1">
                <!-- 文本编辑区 -->
                <section class="text-section">
                    <h2><span class="material-icons"></span> 文本内容</h2>
                    <div class="form-group">
                        <label for="content">输入需要处理的内容：</label>
                        <textarea id="content" placeholder="请在此输入您需要处理的文本内容，也可以通过图片识别后添加文字..."></textarea>
                    </div>
                </section>

                <!-- 图片处理区 -->
                <section class="image-section">
                    <h2><span class="material-icons"></span> 图片处理</h2>
                    <label for="images" class="file-upload-btn">
                        <span class="material-icons"></span>
                        <span class="button-text">选择图片文件</span>
                    </label>
                    <input type="file" id="images" multiple accept="image/*">
                    <p class="hint">支持的格式：JPG, PNG, BMP等常见图片格式</p>

                    <div class="image-preview"></div>

                    <div class="image-options">
                        <label>
                            <input type="checkbox" id="enableOCR" checked>
                            对图片进行文字识别
                        </label>
                    </div>

                    <!-- OCR识别结果区域，默认隐藏 -->
                    <div class="ocr-results hidden">
                        <div class="ocr-header">
                            <h3><span class="material-icons"></span> 识别结果</h3>
                            <button class="merge-all-btn" disabled>
                                <span class="material-icons"></span> 合并全部
                            </button>
                        </div>
                        <div id="ocrContent"></div>
                    </div>
                </section>

                <!-- 生成文档按钮 -->
                <div class="action-bar">
                    <button id="process-images-btn" class="btn secondary" disabled>
                        <span class="material-icons"></span> 处理图片
                    </button>
                    <button id="generate-btn" class="btn primary">
                        <span class="material-icons"></span> 生成文档
                    </button>
                </div>
            </div>

            <div class="tab-pane" id="tab2">
                <section class="pdf-section">
                    <h2><span class="material-icons"></span> PDF上传</h2>
                    <label for="pdf-file" class="file-upload-btn">
                        <span class="material-icons"></span>
                        <span class="button-text">选择PDF文件</span>
                    </label>
                    <input type="file" id="pdf-file" accept=".pdf">
                    <p class="hint">支持单个PDF文件，大小不超过20MB</p>

                    <div class="pdf-preview"></div>

                    <div class="action-bar">
                        <button id="extract-pdf-btn" class="btn primary" disabled>
                            <span class="material-icons"></span> 提取文本
                        </button>
                    </div>
                </section>

                <div class="extract-results">
                    <h3><span class="material-icons"></span> 提取结果</h3>
                    
                    <div class="file-info">
                        <div class="info-item">
                            <span class="material-icons"></span>
                            <span id="pdf-file-name">文件名: </span>
                        </div>
                        <div class="info-item">
                            <span class="material-icons"></span>
                            <span id="pdf-page-count">总页数: </span>
                        </div>
                        <div class="info-item">
                            <span class="material-icons"></span>
                            <span id="pdf-word-count">总字数: </span>
                        </div>
                    </div>
                    
                    <div class="pdf-text-content" id="pdf-text-content"></div>
                    
                    <button id="copy-all-btn" class="copy-btn">
                        <span class="material-icons"></span> 复制全部文本
                    </button>
                </div>
            </div>
        </div>

        <div class="status-section">
            <div class="status-message" id="statusMessage"></div>
        </div>

        <div class="results-grid" id="resultsGrid"></div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-dialog">
                <div class="modal-content">
                    <button class="modal-close" id="modalClose">×</button>
                    <div class="modal-message" id="modalMessage"></div>
                    <div class="modal-buttons">
                        <button class="modal-btn secondary" id="modalCancel">否</button>
                        <button class="modal-btn primary" id="modalConfirm">是</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="app-footer">
            <p>© 2023 智能文档处理系统 - 提高您的文档处理效率</p>
        </footer>
    </div>

    <div class="toast hidden" id="toast"></div>
    
    <div class="loading hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">处理中，请稍候...</div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
