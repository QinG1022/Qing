<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--设置视口宽度为设备宽度，初始缩放比例为1.0-->
    <title>文档生成工具</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap"><!--引入Noto Sans SC字体-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"><!--引入Material Icons字体-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><!--引入样式表-->
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1><span class="material-icons">智能文档处理系统</span></h1><!--标题-->
            <div class="header-subtitle">高效处理文档，提取信息，生成报告</div><!--副标题-->    
        </header>

        <div class="main-content"><!--主内容区域-->
            <div class="tab-container"><!--标签容器-->
                <button class="tab-button active" data-tab="tab1"><!--当前激活的标签页-->
                    <span class="material-icons">文档生成与图片处理</span>
                </button>
                <button class="tab-button" data-tab="tab2">
                    <span class="material-icons">提取PDF文本</span>
                </button>
                <button class="tab-button" data-tab="tab3">
                    <span class="material-icons">AI对话</span>
                </button>
            </div>

            <div class="tab-pane active" id="tab1"><!--当前激活的标签页-->
                <!-- 文本编辑区 -->
                <section class="text-section"><!--文本处理区-->
                    <h2><span class="material-icons">文本处理</span></h2>
                    <div class="form-group">
                        <label for="content">输入内容：</label>
                        <textarea id="content" placeholder="请在此输入您需要处理的文本内容，&#13;也可以通过图片识别后添加文字..."></textarea>
                    </div>
                </section>

                <!-- 图片处理区 -->
                <section class="image-section">
                    <h2><span class="material-icons">图片处理</span></h2>
                    <label for="images" class="file-upload-btn">
                        <span class="material-icons"></span>
                        <span class="button-text">选择图片文件</span>
                    </label>
                    <input type="file" id="images" multiple accept="image/*"><!--上传图片文件-->    
                    <p class="hint">支持的格式：JPG, PNG, BMP等常见图片格式 <br>尽量使上传图片内容清晰，内容太多可能无法识别</p>

                    <div class="image-preview"></div><!--图片预览-->    

                    <div class="image-options"><!--图片选项-->
                        <label>
                            <input type="checkbox" id="enableOCR" checked><!--启用OCR-->
                            对图片进行文字识别
                        </label>
                    </div>

                    <!-- OCR识别结果区域，默认隐藏 -->
                    <div class="ocr-results hidden"><!--OCR识别结果区域，默认隐藏-->
                        <div class="ocr-header"><!--OCR识别结果头部-->  
                            <h3><span class="material-icons">识别结果</span></h3>
                            <button class="merge-all-btn" disabled><!--合并全部按钮-->
                                <span class="material-icons">合并全部</span> 
                            </button>
                        </div>
                        <div id="ocrContent"></div><!--OCR识别结果-->   
                    </div>
                </section>

                <!-- 生成文档按钮 -->
                <div class="action-bar">
                    <button id="process-images-btn" class="btn secondary" disabled><!--处理图片按钮-->  
                        <span class="material-icons">处理图片</span> 
                    </button>
                    <button id="generate-btn" class="btn primary"><!--生成文档按钮-->
                        <span class="material-icons">生成文档</span> 
                    </button>
                </div>
            </div>
            <!-- 提取PDF文本 -->    
            <div class="tab-pane" id="tab2">
                <section class="pdf-section">
                    <h2><span class="material-icons">PDF上传</span></h2>
                    <label for="pdf-file" class="file-upload-btn">
                        <span class="material-icons"></span>
                        <span class="button-text">选择PDF文件</span>
                    </label>
                    <input type="file" id="pdf-file" accept=".pdf">
                    <p class="hint">支持单个PDF文件，大小不超过20MB</p>
                    <!-- PDF预览 -->        
                    <div class="pdf-preview"></div>

                    <div class="action-bar"><!--操作栏-->   
                        <button id="extract-pdf-btn" class="btn primary" disabled><!--提取文本按钮-->   
                            <span class="material-icons">提取文本</span> 
                        </button>
                    </div>
                </section>

                <!-- 提取结果 -->    
                <div class="extract-results">
                    <h3><span class="material-icons">提取结果</span></h3>
                    
                    <div class="file-info"><!--文件信息-->  
                        <div class="info-item">
                            <span class="material-icons"></span>
                            <span id="pdf-file-name">文件名: </span>
                        </div>
                        <div class="info-item">
                            <span class="material-icons"></span>
                            <span id="pdf-page-count">总页数: </span>
                        </div>
                        <div class="info-item">
                            <span class="material-icons"></span>
                            <span id="pdf-word-count">总字数: </span>
                        </div>
                    </div>

                    <!-- 提取文本内容 -->    
                    <div class="pdf-text-content" id="pdf-text-content"></div>
                    <!-- 复制全部文本 -->       
                    <button id="copy-all-btn" class="copy-btn">
                        <span class="material-icons">复制全部文本</span> 
                    </button>
                </div>
            </div>
            <!-- AI对话窗口 -->
            <div class="tab-pane" id="tab3">
                <section class="chat-section">
                    <h2><span class="material-icons">AI对话</span></h2>
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages">
                            <!-- 消息内容将通过JS动态加载 -->
                        </div>
                        <div class="chat-input-container">
                            <textarea id="chatInput" placeholder="请输入您的问题..."></textarea>
                            <button id="sendMessageBtn" class="btn primary">
                                <span class="material-icons">发送</span>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <!-- 状态区域 -->    
        <div class="status-section">
            <div class="status-message" id="statusMessage"></div>
        </div>

        <!-- 结果网格 -->    
        <div class="results-grid" id="resultsGrid"></div>

        <!-- 历史记录区域 -->
        <div class="history-section">
            <div class="history-header"><!--历史记录头部--> 
                <h2><span class="material-icons">历史记录</span>  <span class="history-count" id="historyCount">(共0/6条内容)</span></h2>
                <div class="history-actions-header">
                    <button id="clearHistoryBtn" class="clear-btn">
                        <span class="material-icons">清空</span> 
                    </button>
                    <button id="refreshHistoryBtn" class="refresh-btn">
                        <span class="material-icons">刷新</span> 
                    </button>
                </div>
            </div>
            <div class="history-container" id="historyContainer">
                <!-- 历史记录内容将通过JS动态加载 -->
                <div class="loading-history">
                    <div class="mini-spinner"></div>
                    <div>加载中...</div>
                </div>
            </div>
        </div>

        <!-- 模态框 -->    
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-dialog">
                <div class="modal-content">
                    <button class="modal-close" id="modalClose">×</button><!--关闭按钮-->
                    <div class="modal-message" id="modalMessage"></div><!--提示消息 -->
                    <div class="modal-buttons">
                        <button class="modal-btn secondary" id="modalCancel">否</button>
                        <button class="modal-btn primary" id="modalConfirm">是</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部 -->    
        <footer class="app-footer">
            <p>© 2025 智能文档处理系统 - 提高您的文档处理效率</p>
        </footer>
    </div>

    <div class="toast hidden" id="toast"></div>

    <!-- 加载状态 -->       
    <div class="loading hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">处理中，请稍候...</div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
